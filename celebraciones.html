document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

'DM Sans',sans-serif;color:#24211D\">\n\n  <section data-screen-label=\"Celebraciones · Hero\" style=\"position:relative;height:clamp(560px,calc(52vw + 340px),100svh);background:#56634F;color:#F6F2EA;overflow:hidden\">\n    <dc-import name=\"Foto\" label=\"Ceremonia en el claro del bosque, luz de tarde\" tone=\"verde\" label-top=\"true\" style=\"position:absolute;inset:0\" hint-size=\"100%,100%\"><\u002Fdc-import>\n    <div style=\"position:absolute;left:0;right:0;bottom:0;pointer-events:none;padding:0 clamp(20px,5vw,72px) clamp(40px,7vw,88px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:28px 48px\">\n      <div style=\"display:flex;flex-direction:column;gap:16px\">\n        <h1 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(60px,10vw,152px);line-height:0.9;letter-spacing:-0.015em\">Celebraciones<\u002Fh1>\n        <p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(24px,2.4vw,32px);line-height:1.2\">El entorno perfecto por un día perfecto.<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"#visita\" style=\"pointer-events:auto;display:flex;align-items:center;justify-content:center;min-height:52px;min-width:220px;padding:0 28px;background:#F6F2EA;color:#3E4A3D;border:1px solid #F6F2EA;border-radius:2px;text-decoration:none;font-size:12.5px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;transition:background-color .3s ease,color .3s ease\" style-hover=\"background:transparent;color:#F6F2EA\">Pedir visita<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Celebraciones · Introducción\" style=\"padding:clamp(80px,12vw,168px) clamp(20px,5vw,72px)\">\n    <p style=\"margin:0;max-width:30ch;font-family:'Cormorant Garamond',serif;font-size:clamp(25px,3.4vw,48px);line-height:1.22;color:#24211D;text-wrap:pretty\">Mas Formigosa es el lugar ideal para hacer las celebraciones más especiales o aquellos encuentros de amigos o familiares inolvidables. Un lugar excepcional en un paraje magnífico, tranquilo, rodeado de natura y con unos espacios acogedores.<\u002Fp>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Celebraciones · El día\" style=\"padding:0 0 clamp(96px,13vw,180px);display:flex;flex-direction:column;gap:clamp(96px,13vw,190px)\">\n    <h2 style=\"margin:0 clamp(20px,5vw,72px);padding-top:24px;border-top:1px solid rgba(62,74,61,0.3);font-size:12.5px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#3E4A3D\">El día, de principio a fin<\u002Fh2>\n\n    <article style=\"display:flex;flex-direction:column;gap:clamp(28px,4vw,48px)\">\n      <div style=\"position:relative;height:clamp(440px,68vw,880px)\"><dc-import name=\"Foto\" label=\"Ceremonia civil en el claro del bosque, sillas entre los árboles\" tone=\"verde\" style=\"position:absolute;inset:0\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv>\n      <div style=\"padding:0 clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 48px\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1;color:#A8683F\">01<\u002Fspan><h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(48px,6.4vw,96px);line-height:0.98;color:#3E4A3D\">Ceremonia en el bosque<\u002Fh3><\u002Fdiv>\n        <p style=\"margin:0;font-size:17px;line-height:1.65;max-width:38ch;text-wrap:pretty\">Ceremonia civil en el claro del bosque.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article style=\"padding:0 clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;align-items:flex-end;gap:32px clamp(40px,8vw,140px)\">\n      <div style=\"flex:1 1 320px;max-width:520px;position:relative;aspect-ratio:4/5;min-width:0\"><dc-import name=\"Foto\" label=\"Cóctel en la gran plaza ante la fachada, terrazas ajardinadas\" tone=\"piedra\" style=\"position:absolute;inset:0\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv>\n      <div style=\"flex:1 1 280px;max-width:420px;display:flex;flex-direction:column;gap:14px;padding-bottom:clamp(0px,4vw,64px)\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1;color:#A8683F\">02<\u002Fspan><h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(38px,3.8vw,56px);line-height:0.98;color:#3E4A3D\">Cóctel en la plaza<\u002Fh3><p style=\"margin:0;font-size:17px;line-height:1.65;max-width:38ch;text-wrap:pretty\">La gran plaza que preside la fachada y las terrazas ajardinadas.<\u002Fp><\u002Fdiv>\n    <\u002Farticle>\n\n    <article style=\"padding:0 0 0 clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;flex-direction:row-reverse;align-items:flex-start;gap:32px clamp(32px,5vw,80px)\">\n      <div style=\"flex:3 1 520px;position:relative;aspect-ratio:16/10;min-width:0\"><dc-import name=\"Foto\" label=\"Banquete en la plaza, mesas largas al caer la tarde\" tone=\"piedra\" style=\"position:absolute;inset:0\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv>\n      <div style=\"flex:1 1 260px;max-width:360px;display:flex;flex-direction:column;gap:14px;padding-right:clamp(20px,5vw,72px);padding-top:clamp(0px,3vw,48px)\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1;color:#A8683F\">03<\u002Fspan><h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(38px,3.8vw,56px);line-height:0.98;color:#3E4A3D\">Banquete<\u002Fh3><p style=\"margin:0;font-size:17px;line-height:1.65;max-width:38ch;text-wrap:pretty\">En la plaza, con carpa si hace falta.<\u002Fp><\u002Fdiv>\n    <\u002Farticle>\n\n    <article style=\"padding:0 clamp(20px,5vw,72px);display:flex;flex-direction:column;align-items:center;gap:clamp(36px,5vw,64px)\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1;color:#A8683F\">04<\u002Fspan><h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(48px,6.4vw,96px);line-height:0.98;color:#3E4A3D\">Fiesta<\u002Fh3><p style=\"margin:0;font-size:17px;line-height:1.65\">Zona de baile, hasta las 04:00.<\u002Fp><\u002Fdiv>\n      <div style=\"position:relative;width:100%;aspect-ratio:16/9;min-height:300px\"><dc-import name=\"Foto\" label=\"Zona de baile de noche, invitados y luces cálidas\" tone=\"verde\" style=\"position:absolute;inset:0\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv>\n    <\u002Farticle>\n\n    <article style=\"padding:clamp(24px,6vw,96px) clamp(20px,5vw,72px) 0;display:flex;flex-direction:column;align-items:center;gap:clamp(28px,4vw,44px)\">\n      <div style=\"position:relative;width:100%;max-width:440px;aspect-ratio:3/4\"><dc-import name=\"Foto\" label=\"Habitación doble de los novios, primera luz del día siguiente\" tone=\"piedra\" style=\"position:absolute;inset:0\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:440px\"><span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1;color:#A8683F\">05<\u002Fspan><h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(38px,3.8vw,56px);line-height:0.98;color:#3E4A3D\">Noche en la masía<\u002Fh3><p style=\"margin:0;font-size:17px;line-height:1.65;text-wrap:pretty\">Cuatro habitaciones con baño propio para los novios y la familia cercana.<\u002Fp><\u002Fdiv>\n    <\u002Farticle>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Celebraciones · Ficha\" style=\"background:#E4DCCD;padding:clamp(80px,10vw,140px) clamp(20px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:40px clamp(32px,5vw,88px);align-items:start\">\n    <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(44px,5.4vw,76px);line-height:1;color:#3E4A3D\">Ficha esencial<\u002Fh2>\n    <dl style=\"margin:0;border-bottom:1px solid rgba(36,33,29,0.3)\">\n      <div style=\"display:grid;grid-template-columns:minmax(110px,0.38fr) minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid rgba(36,33,29,0.3)\"><dt style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D;padding-top:4px\">Invitados<\u002Fdt><dd style=\"margin:0;font-size:17px;line-height:1.55\">De 50 a 100<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(110px,0.38fr) minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid rgba(36,33,29,0.3)\"><dt style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D;padding-top:4px\">Exclusividad<\u002Fdt><dd style=\"margin:0;font-size:17px;line-height:1.55\">Una celebración al día, toda la masía<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(110px,0.38fr) minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid rgba(36,33,29,0.3)\"><dt style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D;padding-top:4px\">Menús<\u002Fdt><dd style=\"margin:0;font-size:17px;line-height:1.55\">Desde 70 € por persona<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(110px,0.38fr) minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid rgba(36,33,29,0.3)\"><dt style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D;padding-top:4px\">Horario<\u002Fdt><dd style=\"margin:0;font-size:17px;line-height:1.55\">Hasta las 04:00<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(110px,0.38fr) minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid rgba(36,33,29,0.3)\"><dt style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D;padding-top:4px\">Cocina<\u002Fdt><dd style=\"margin:0;font-size:17px;line-height:1.55\">Menús a medida; vegetarianos, veganos y celíacos. También podéis traer vuestro catering<\u002Fdd><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:minmax(110px,0.38fr) minmax(0,1fr);gap:20px;padding:20px 0;border-top:1px solid rgba(36,33,29,0.3)\"><dt style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D;padding-top:4px\">Alojamiento<\u002Fdt><dd style=\"margin:0;font-size:17px;line-height:1.55\">4 habitaciones: 3 para 4 personas y una doble para los novios<\u002Fdd><\u002Fdiv>\n    <\u002Fdl>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Celebraciones · Reseñas\" style=\"padding:clamp(80px,12vw,168px) clamp(20px,5vw,72px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:56px clamp(32px,5vw,88px)\">\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:20px;border-top:1px solid rgba(62,74,61,0.3);padding-top:28px\">\n      <blockquote style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(30px,3vw,44px);line-height:1.15;color:#24211D;text-wrap:pretty\">«Casarse en el bosque no tiene precio.»<\u002Fblockquote>\n      <figcaption style=\"font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D\">Miriam<\u002Ffigcaption>\n    <\u002Ffigure>\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:20px;border-top:1px solid rgba(62,74,61,0.3);padding-top:28px\">\n      <blockquote style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(30px,3vw,44px);line-height:1.15;color:#24211D;text-wrap:pretty\">«Desde la primera visita nos encantó la masía, sus vistas y su energía.»<\u002Fblockquote>\n      <figcaption style=\"font-size:12.5px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D\">Julieta<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fsection>\n\n  <section id=\"visita\" data-screen-label=\"Celebraciones · Pedir visita\" style=\"scroll-margin-top:60px;border-top:1px solid rgba(62,74,61,0.3);margin:0 clamp(20px,5vw,72px);padding:clamp(72px,10vw,140px) 0 clamp(80px,12vw,168px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:48px clamp(32px,5vw,88px);align-items:start\">\n    <div style=\"display:flex;flex-direction:column;gap:28px\">\n      <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(44px,5.4vw,76px);line-height:1;color:#3E4A3D\">Pedir visita<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:6px;font-size:17px;line-height:1.5\">\n        <a href=\"tel:+34625039316\" style=\"color:#3E4A3D;text-decoration:none\">625 039 316<\u002Fa>\n        <a href=\"mailto:masformigosa@gmail.com\" style=\"color:#3E4A3D;text-decoration:none\">masformigosa@gmail.com<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n      <form sc-camel-on-submit=\"{{ submit }}\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:28px 32px\">\n        <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D\">Nombre<\u002Fspan><input name=\"nombre\" required=\"\" style=\"border:0;border-bottom:1px solid rgba(36,33,29,0.4);background:transparent;padding:10px 0;font-size:17px;outline:none;border-radius:0;transition:border-color .25s\" style-focus=\"border-bottom-color:#3E4A3D\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D\">Email<\u002Fspan><input name=\"email\" type=\"email\" required=\"\" style=\"border:0;border-bottom:1px solid rgba(36,33,29,0.4);background:transparent;padding:10px 0;font-size:17px;outline:none;border-radius:0;transition:border-color .25s\" style-focus=\"border-bottom-color:#3E4A3D\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D\">Teléfono<\u002Fspan><input name=\"telefono\" type=\"tel\" style=\"border:0;border-bottom:1px solid rgba(36,33,29,0.4);background:transparent;padding:10px 0;font-size:17px;outline:none;border-radius:0;transition:border-color .25s\" style-focus=\"border-bottom-color:#3E4A3D\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D\">Fecha aproximada<\u002Fspan><input name=\"fecha\" style=\"border:0;border-bottom:1px solid rgba(36,33,29,0.4);background:transparent;padding:10px 0;font-size:17px;outline:none;border-radius:0;transition:border-color .25s\" style-focus=\"border-bottom-color:#3E4A3D\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;grid-column:1/-1\"><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D\">Número de invitados<\u002Fspan><input name=\"invitados\" inputmode=\"numeric\" style=\"border:0;border-bottom:1px solid rgba(36,33,29,0.4);background:transparent;padding:10px 0;font-size:17px;outline:none;border-radius:0;transition:border-color .25s\" style-focus=\"border-bottom-color:#3E4A3D\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;grid-column:1/-1\"><span style=\"font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#3E4A3D\">Mensaje<\u002Fspan><textarea name=\"mensaje\" rows=\"4\" style=\"border:0;border-bottom:1px solid rgba(36,33,29,0.4);background:transparent;padding:10px 0;font-size:17px;line-height:1.6;outline:none;border-radius:0;resize:vertical;transition:border-color .25s\" style-focus=\"border-bottom-color:#3E4A3D\"><\u002Ftextarea><\u002Flabel>\n        <div style=\"grid-column:1/-1;padding-top:8px\">\n          <button type=\"submit\" style=\"min-height:52px;min-width:220px;padding:0 28px;background:#3E4A3D;color:#F6F2EA;border:1px solid #3E4A3D;border-radius:2px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;transition:background-color .3s ease,color .3s ease\" style-hover=\"background:transparent;color:#3E4A3D\">Pedir visita<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border-top:1px solid rgba(62,74,61,0.3);border-bottom:1px solid rgba(62,74,61,0.3);padding:40px 0;display:flex;flex-direction:column;gap:12px\">\n        <p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:clamp(30px,3vw,40px);line-height:1.15;color:#3E4A3D\">Gracias. Hemos recibido vuestra solicitud.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n<\u002Fmain>\n<dc-import name=\"Pie\" hint-size=\"100%,480px\"><\u002Fdc-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { sent: false };\n  renderVals() {\n    return {\n      sent: this.state.sent, notSent: !this.state.sent,\n      submit: (e) => { e.preventDefault(); this.setState({ sent: true }); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
